<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training Academy — Linda’s Dog Training</title>
  <meta name="description" content="Free training guides from Linda — recall, loose-lead walking, settling and more.">
  <meta name="theme-color" content="#0E0D0B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E0D0B'/%3E%3Ctext x='32' y='45' font-family='Georgia' font-style='italic' font-size='38' text-anchor='middle' fill='%23E8A33D'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/shared/vendor/lenis.css">
  <link rel="stylesheet" href="/v1/assets/css/tokens.css">
  <link rel="stylesheet" href="/v1/assets/css/base.css">
  <link rel="stylesheet" href="/v1/assets/css/components.css">
  <link rel="stylesheet" href="/v1/assets/css/marketing.css">
</head>
<body data-page="academy">
  <div class="grain" aria-hidden="true"></div>
  <main id="main">
    <section class="phero wrap">
      <div class="phero__glow"></div>
      <p class="eyebrow eyebrow--amber">The Training Academy</p>
      <h1 class="phero__title serif" data-split data-split-now>Learn it once. <em>Live it daily.</em></h1>
      <div class="phero__row"><p class="lead">Step-by-step guides with trainer-approved video, written for the time between sessions. Start with Recall 101.</p><span class="badge st-pending badge--dotless">Phase 2 preview</span></div>
    </section>
    <section class="wrap">
      <div class="feature-guide" id="feature-guide" data-reveal></div>
    </section>
    <section class="wrap" aria-labelledby="all-guides">
      <div class="academy-bar">
        <h2 class="h3" id="all-guides">All guides <span class="mono faint" style="font-size:.8rem" id="guide-count"></span></h2>
        <div class="row row--wrap">
          <div class="segmented" role="group" aria-label="Level"><button aria-pressed="true" data-level="all">All levels</button><button aria-pressed="false" data-level="Foundation">Foundation</button><button aria-pressed="false" data-level="Intermediate">Intermediate</button></div>
          <div class="input-icon"><i data-lucide="search"></i><input class="input input--sm" id="guide-search" type="search" placeholder="Search guides" aria-label="Search guides" style="padding-left:40px"></div>
        </div>
      </div>
      <div class="filters" id="tech-filters" role="group" aria-label="Filter by technique"></div>
      <div class="guide-grid" id="guide-grid" aria-live="polite"></div>
    </section>
    <section class="section wrap" aria-labelledby="tech-title">
      <div class="section-head"><p class="eyebrow eyebrow--amber">The vocabulary</p><h2 class="h2" id="tech-title" data-split>Techniques we <em>train.</em></h2></div>
      <div class="technique-index" id="technique-index" data-stagger></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/shared/data.js"></script>
  <script src="/v1/assets/js/core.js"></script>
  <script src="/shared/vendor/gsap.min.js"></script>
  <script src="/shared/vendor/ScrollTrigger.min.js"></script>
  <script src="/shared/vendor/SplitText.min.js"></script>
  <script src="/shared/vendor/CustomEase.min.js"></script>
  <script src="/shared/vendor/Flip.min.js"></script>
  <script src="/shared/vendor/lenis.min.js"></script>
  <script src="/shared/vendor/lucide.min.js"></script>
  <script src="/v1/assets/js/site.js"></script>
  <script src="/v1/assets/js/pages.js"></script>
</body>
</html>
